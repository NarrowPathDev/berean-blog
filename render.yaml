services:
  - type: web
    name: berean-blog
    runtime: python
    plan: free
    branch: main
    autoDeploy: true

    buildCommand: ./build.sh

    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: SITE_URL
        value: https://thebereanscale.com

      - key: DATABASE_URL
        fromDatabase:
          name: berean-db
          property: connectionString


databases:
  - name: berean-db
    databaseName: berean_blog
    user: berean_blog
    plan: free
    ipAllowList: []
